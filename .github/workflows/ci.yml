# push と PR のたびに、テスト・型の検査・組み立てと、Node での起動を確かめる。
# 手元の commit は lefthook が見るので、ここが要るのは手元を通らない PR のため。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後の段に GitHub の鍵を残さない
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 支える Node は 24 だけ（package.json の engines）
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm pack --dry-run

  # 仕組みそのものの点検（書き間違い・SHA の固定漏れ・守りの穴）。道具の版は mise.toml で固定している
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: actionlint
      - run: pinact run --check
      # GitHub に問い合わせる点検（乗っ取られた Actions・既知の穴）も流すので、読むだけの鍵を渡す
      - run: zizmor --no-progress .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
