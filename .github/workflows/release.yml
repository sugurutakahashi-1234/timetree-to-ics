# v0.2.0 の形の札を push したら、npm に出して GitHub の Release を作る。
# npm へは信頼された出し方（OIDC）で出すので、npm の鍵を GitHub に置かない。来歴（provenance）も自動で付く。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub の Release を作る
  id-token: write # npm の信頼された出し方

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後の段に GitHub の鍵を残さない
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true # 出す仕組みでは、前の実行の残り物を使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 に入っている npm（11.19）で、信頼された出し方（11.5.1 以上）が使える
          node-version: 24
          registry-url: https://registry.npmjs.org
          # 出す仕組みでは、前の実行の残り物（キャッシュ）を使わない
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: 札と package.json の版がそろっているか
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: npm に出す（同じ版が出ていれば飛ばす。最初の版は手元から出したため）
        run: |
          name=$(node -p 'require("./package.json").name')
          if npm view "$name@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME#v} は出ているので飛ばす"
          else
            npm publish --access public
          fi
      - name: GitHub の Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
