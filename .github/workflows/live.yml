# 週 1 回、本物の TimeTree の公開カレンダーを読み、API が変わっていないかを確かめる。失敗したら GitHub が持ち主にメールで知らせる。
# 読むカレンダーの名前はリポジトリに書かず、秘密の設定 TIMETREE_LIVE_CALENDAR に置く（誰がどのカレンダーを見ているかを出さないため）
name: live

on:
  schedule:
    - cron: "41 0 * * 1" # 毎週月曜の UTC 0:41（日本時間 9:41）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: 本物の公開カレンダーを読む
        env:
          TIMETREE_LIVE_CALENDAR: ${{ secrets.TIMETREE_LIVE_CALENDAR }}
        run: bun scripts/live-check.ts
